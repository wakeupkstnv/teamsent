[package]
name = "teamsent-relay"
version = "0.1.0"
edition = "2021"
description = "Relay that pairs teamsent hosts and guests over WebSocket"
license = "Apache-2.0"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = "0.24"
tracing = "0.1.44"

[[bin]]
name = "teamsent-relay"
path = "src/main.rs"
